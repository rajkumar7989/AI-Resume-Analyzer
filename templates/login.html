<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - AI Resume Analyzer</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .box {
            width: 100%;
            max-width: 420px;

            background: white;

            padding: 40px;

            border-radius: 18px;

            box-shadow: 0 10px 35px rgba(0,0,0,0.08);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            width: 65px;
            height: 65px;

            margin: 0 auto 15px;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #eef2ff;

            border-radius: 50%;

            font-size: 30px;
        }

        h1 {
            color: #4f46e5;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6b7280;
            font-size: 14px;
        }

        .error {
            background: #fee2e2;
            color: #dc2626;

            padding: 12px;

            border-radius: 8px;

            text-align: center;

            font-size: 14px;

            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            color: #374151;

            font-size: 14px;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            font-size: 15px;

            outline: none;
        }

        input:focus {
            border-color: #4f46e5;

            box-shadow:
                0 0 0 3px rgba(79,70,229,0.1);
        }

        button {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #4f46e5;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #3730a3;
        }

        .register {
            text-align: center;

            margin-top: 25px;

            color: #6b7280;

            font-size: 14px;
        }

        .register a {
            color: #4f46e5;

            text-decoration: none;

            font-weight: bold;
        }

        .home {
            display: block;

            text-align: center;

            margin-top: 18px;

            color: #6b7280;

            text-decoration: none;

            font-size: 13px;
        }

    </style>

</head>

<body>

    <div class="box">

        <div class="logo">

            <div class="logo-icon">
                🤖
            </div>

            <h1>
                AI Resume Analyzer
            </h1>

            <p class="subtitle">
                Login to continue your career analysis
            </p>

        </div>


        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}


        <form
            action="/login"
            method="POST"
        >

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button type="submit">
                Login
            </button>

        </form>


        <div class="register">

            Don't have an account?

            <a href="/register">
                Create Account
            </a>

        </div>


        <a href="/" class="home">
            ← Back to Home
        </a>

    </div>

</body>

</html>
